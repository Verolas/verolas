name: iac-plan

on:
  pull_request:
    branches: [main]
    paths:
      - 'infra/**'
      - '.github/workflows/iac-plan.yml'

concurrency:
  group: iac-plan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect:
    name: detect changed env
    runs-on: ubuntu-24.04
    outputs:
      envs: ${{ steps.find.outputs.envs }}
      any: ${{ steps.find.outputs.any }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Identify environments with changes
        id: find
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          changed=$(git diff --name-only "$base" "$head" -- 'infra/**' || true)
          envs=()
          for env in dev staging prod; do
            if echo "$changed" | grep -qE "^infra/(modules/|live/${env}/)"; then
              if ls "infra/live/${env}"/*.tf >/dev/null 2>&1; then
                envs+=("\"${env}\"")
              fi
            fi
          done
          if [ ${#envs[@]} -eq 0 ]; then
            echo "any=false" >> "$GITHUB_OUTPUT"
            echo "envs=[]" >> "$GITHUB_OUTPUT"
            echo "No environments with .tf files affected, plan will skip."
          else
            echo "any=true" >> "$GITHUB_OUTPUT"
            echo "envs=[$(IFS=, ; echo "${envs[*]}")]" >> "$GITHUB_OUTPUT"
          fi

  plan:
    name: tofu plan ${{ matrix.env }}
    needs: detect
    if: needs.detect.outputs.any == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: write
    strategy:
      fail-fast: false
      matrix:
        env: ${{ fromJson(needs.detect.outputs.envs) }}
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.HETZNER_S3_ACCESS_KEY }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.HETZNER_S3_SECRET_KEY }}
      TF_VAR_hcloud_token: ${{ secrets.HCLOUD_TOKEN }}
      TF_VAR_hetzner_s3_access_key: ${{ secrets.HETZNER_S3_ACCESS_KEY }}
      TF_VAR_hetzner_s3_secret_key: ${{ secrets.HETZNER_S3_SECRET_KEY }}
      TF_VAR_cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      TF_VAR_cloudflare_account_id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Check required secrets are configured
        id: gate
        env:
          HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN }}
          HETZNER_S3_ACCESS_KEY: ${{ secrets.HETZNER_S3_ACCESS_KEY }}
          HETZNER_S3_SECRET_KEY: ${{ secrets.HETZNER_S3_SECRET_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SSH_PUBLIC_KEY: ${{ secrets.SSH_PUBLIC_KEY }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          missing=()
          for s in HCLOUD_TOKEN HETZNER_S3_ACCESS_KEY HETZNER_S3_SECRET_KEY CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID SSH_PUBLIC_KEY SSH_PRIVATE_KEY; do
            if [ -z "${!s}" ]; then
              missing+=("$s")
            fi
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::warning::iac-plan is skipping because these required secrets are not configured: ${missing[*]}. See .github/SECRETS.md."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: opentofu/setup-opentofu@v1
        if: steps.gate.outputs.skip != 'true'
        with:
          tofu_version: 1.12.0

      - name: Prepare SSH keys
        if: steps.gate.outputs.skip != 'true'
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' '${{ secrets.SSH_PUBLIC_KEY }}' > ~/.ssh/verolas_cluster_dev.pub
          printf '%s\n' '${{ secrets.SSH_PRIVATE_KEY }}' > ~/.ssh/verolas_cluster_dev
          chmod 600 ~/.ssh/verolas_cluster_dev
          chmod 644 ~/.ssh/verolas_cluster_dev.pub

      - name: tofu init
        if: steps.gate.outputs.skip != 'true'
        working-directory: infra/live/${{ matrix.env }}
        run: tofu init -input=false

      - name: tofu plan
        if: steps.gate.outputs.skip != 'true'
        id: plan
        working-directory: infra/live/${{ matrix.env }}
        run: |
          set -o pipefail
          tofu plan -no-color -input=false 2>&1 | tee plan.txt
          {
            echo 'plan<<TOFU_PLAN_EOF'
            head -c 60000 plan.txt
            echo
            echo 'TOFU_PLAN_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Post plan as PR comment
        if: steps.gate.outputs.skip != 'true'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: tofu-plan-${{ matrix.env }}
          message: |
            ### tofu plan for `infra/live/${{ matrix.env }}`

            <details><summary>Plan output</summary>

            ```hcl
            ${{ steps.plan.outputs.plan }}
            ```

            </details>
