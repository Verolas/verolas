[project]
name = "verolas-api"
version = "0.0.0"
description = "Verolas API gateway. FastAPI service with OIDC auth, RLS scoped Postgres, Prometheus metrics."
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [{ name = "Verolas" }]
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "pydantic[email]>=2.9.0",
  "pydantic-settings>=2.6.0",
  "structlog>=24.4.0",
  "prometheus-client>=0.21.0",
  "verolas-auth",
  "verolas-storage",
  "psycopg[binary,pool]>=3.2.0",
  "cryptography>=43.0.0",
  "httpx>=0.27.0",
  "reportlab>=4.2.0",
  "anthropic>=0.40.0",
  "ezdxf>=1.3.0",
  "ifcopenshell>=0.8.0",
]

[dependency-groups]
dev = [
  "httpx>=0.27.0",
  "mypy>=1.13.0",
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
  "ruff>=0.7.0",
  "asgi-lifespan>=2.1.0",
  "moto[s3]>=5.2.1",
  "types-boto3>=1.43.14",
]

[tool.uv.sources]
verolas-auth = { path = "../../services/auth" }
verolas-storage = { path = "../../services/storage" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["verolas_api"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ANN", "RUF"]
ignore = ["ANN401"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN", "S101"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = "prometheus_client.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "reportlab.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "ezdxf.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "ifcopenshell.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
