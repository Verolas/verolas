# Verolas Origin - machine-readable data source manifest.
#
# Consumed by:
#   - data/origin/scripts/fetch_all.sh       (downloads to local cache)
#   - data/origin/scripts/validate_manifest.py  (sha256 + presence check)
#   - apps/api/verolas_api/workflow/origin/data_loader.py  (resolves a
#     source_id to its local file path at runtime; to be added in P3)
#
# Editing rules:
#   - Every source has a unique `id` (dot-separated, snake_case).
#   - `url` is the canonical source-of-truth.
#   - `license` is SPDX where possible, or a free-form string for
#     publisher-specific licences. Always record `attribution_required`.
#   - `manual: true` means fetch_all.sh prints instructions and does
#     NOT download (ToS gate, registration, or login wall).
#   - `consumed_by` lists the engine modules that read this source.

version: 2
last_updated: 2026-05-27

