apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: keycloak

configMapGenerator:
  - name: verolas-theme-login
    files:
      - themes/verolas/login/theme.properties
      - themes/verolas/login/template.ftl
      - themes/verolas/login/login.ftl
  - name: verolas-theme-login-css
    files:
      - themes/verolas/login/resources/css/styles.css
  - name: verolas-theme-login-img
    files:
      - themes/verolas/login/resources/img/logo.svg

generatorOptions:
  disableNameSuffixHash: true
