apiVersion: apps/v1
kind: Deployment
metadata:
  name: verolas-web
  namespace: verolas-web
  labels:
    app.kubernetes.io/name: verolas-web
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: verolas-web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: verolas-web
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          image: ghcr.io/verolas/web:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: NODE_ENV
              value: production
            - name: NEXT_TELEMETRY_DISABLED
              value: "1"
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /login
              port: http
            initialDelaySeconds: 15
            periodSeconds: 30
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /login
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
---
apiVersion: v1
kind: Service
metadata:
  name: verolas-web
  namespace: verolas-web
  labels:
    app.kubernetes.io/name: verolas-web
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: verolas-web
  ports:
    - name: http
      port: 80
      targetPort: http
