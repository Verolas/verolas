[project]
name = "verolas-storage"
version = "0.0.0"
description = "Verolas storage primitives: presigned URLs, clamd scanning, macro detection."
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [{ name = "Verolas" }]
dependencies = [
  "boto3>=1.35.0",
  "botocore>=1.35.0",
  "pydantic>=2.9.0",
]

[dependency-groups]
dev = [
  "moto[s3]>=5.0.0",
  "mypy>=1.13.0",
  "pytest>=8.3.0",
  "ruff>=0.7.0",
  "types-boto3>=1.35.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["verolas_storage"]
force-include = { "verolas_storage/py.typed" = "verolas_storage/py.typed" }

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ANN", "RUF"]
ignore = ["ANN401"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN", "S101"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = "moto.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
